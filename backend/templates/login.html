<!DOCTYPE html>
<html data-bs-theme="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Electricity Management System</title>
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-light">
    <div class="container d-flex min-vh-100 justify-content-center align-items-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card rounded-3 border-0 shadow-sm p-4">
                    <div class="card-body">
                        <h4 class="text-center mb-2 card-title">Electricity Management System</h4>
                        <p class="text-center text-muted mb-4">Sign in to access dashboard</p>
                        <form id="login-form" method="post" action="/login">
                            <label class="form-label" for="username">Username</label>
                            <input class="form-control mb-3" type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control mb-3" type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                            {% if error %}
                            <p class="text-danger" id="login-error">{{ error }}</p>
                            {% endif %}
                            <button class="btn btn-primary w-100" id="login-button" type="submit">Log In</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/bootstrap/js/bootstrap.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
